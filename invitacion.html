<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FDE9EC; --bg2:#FBD9E2; --card:#FFF7F8; --rosa:#E8899B; --rosa-d:#C96B80;
  --oro:#D9B06C; --ink:#4A3540; --muted:#B98A96;
  --display:"Fraunces",Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px;
  font-family:var(--body);color:var(--ink);overflow-x:hidden;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;
}
#hearts{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#hearts span{position:absolute;font-size:16px;opacity:.5;animation:float linear infinite}
@keyframes float{
  0%{transform:translateY(10vh) translateX(0) rotate(0deg);opacity:0}
  10%{opacity:.55}
  90%{opacity:.4}
  100%{transform:translateY(-115vh) translateX(var(--drift)) rotate(20deg);opacity:0}
}

.card{
  position:relative;z-index:2;width:100%;max-width:420px;background:var(--card);
  border-radius:22px;padding:46px 34px;text-align:center;
  box-shadow:0 30px 70px rgba(201,107,128,.22),0 4px 18px rgba(201,107,128,.12);
}
.corazon{font-size:30px;margin-bottom:6px}
.k{font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--rosa-d);margin-bottom:18px}
h1{font-family:var(--display);font-weight:300;font-style:italic;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.25;color:var(--ink)}
h1 b{font-weight:600;font-style:normal;color:var(--rosa-d)}

.opciones{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.op{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;cursor:pointer;
  border:1.5px solid rgba(232,137,155,.28);background:#fff;text-align:left;
  transition:transform .25s,box-shadow .25s,border-color .25s,opacity .3s;
}
.op:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(201,107,128,.16);border-color:var(--rosa)}
.op:active{transform:translateY(0) scale(.98)}
.op.elegida{border-color:var(--rosa-d);background:#FFF0F3}
.op.oculta{opacity:0;pointer-events:none}
.op .ic{font-size:26px}
.op .nom{font-family:var(--display);font-weight:500;font-size:1.15rem;color:var(--ink)}

.confirmado{display:none;flex-direction:column;align-items:center;gap:6px}
.confirmado.on{display:flex}
.confirmado .ic{font-size:38px}
.confirmado .txt{font-family:var(--display);font-style:italic;font-size:1.2rem;color:var(--rosa-d)}

.pie{margin-top:34px;font-family:var(--display);font-style:italic;font-size:1.05rem;color:var(--rosa-d)}
.firma{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

@media(prefers-reduced-motion:reduce){#hearts{display:none}}
</style>
</head>
<body>

<div id="hearts"></div>

<div class="card">
  <div class="corazon">🌸</div>
  <div class="k">una invitación</div>
  <h1>Ponte <b>preciosa</b>,<br>que te invito a cenar.</h1>

  <div class="opciones" id="opciones">
    <div class="op" data-opt="Japonés 🍣"><span class="ic">🍣</span><span class="nom">Japonés</span></div>
    <div class="op" data-opt="Pizza 🍕"><span class="ic">🍕</span><span class="nom">Pizza</span></div>
  </div>

  <div class="confirmado" id="confirmado">
    <div class="ic">💌</div>
    <div class="txt" id="confTxt"></div>
  </div>

  <div class="pie" id="pie">Tú eliges. Yo solo quiero verte guapa.</div>
  <div class="firma">Julen 💗</div>
</div>

<script>
(function(){
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    var box=document.getElementById("hearts");
    var ico=["💗","💕","🌸","♡"];
    for(var i=0;i<22;i++){
      var s=document.createElement("span");
      s.textContent=ico[Math.floor(Math.random()*ico.length)];
      s.style.left=Math.random()*100+"%";
      s.style.setProperty("--drift",(Math.random()*80-40)+"px");
      s.style.animationDuration=(9+Math.random()*10)+"s";
      s.style.animationDelay=(Math.random()*10)+"s";
      s.style.fontSize=(12+Math.random()*14)+"px";
      box.appendChild(s);
    }
  }
})();

/* ▼ TU NÚMERO DE WHATSAPP, con prefijo de país, sin + ni espacios ▼ */
var MI_WHATSAPP = "34627885033";

document.querySelectorAll(".op").forEach(function(op){
  op.addEventListener("click", function(){
    var elegido = this.dataset.opt;
    document.querySelectorAll(".op").forEach(function(o){
      o.classList.toggle("elegida", o===op);
      o.classList.toggle("oculta", o!==op);
    });
    document.getElementById("pie").style.display="none";
    document.getElementById("confTxt").textContent = "Vengaaa, " + elegido.split(" ")[0] + " entonces";
    document.getElementById("confirmado").classList.add("on");

    var msg = encodeURIComponent("He elegido: " + elegido);
    setTimeout(function(){
      window.location.href = "https://wa.me/" + MI_WHATSAPP + "?text=" + msg;
    }, 900);
  });
});

</script>
</body>
</html>
